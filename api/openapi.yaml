openapi: 3.0.3
info:
  title: Meetopoly API
  version: 0.30.0
  description: |
    Meetopoly HTTP API contract.
    Source of truth for mobile codegen (orval → meetopoly-mobile/api/).
  contact:
    name: Meetopoly
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
    description: Liveness and dependency checks
  - name: Auth
    description: Email signup, verification, login, session
  - name: User
    description: Authenticated profile
  - name: Locations
    description: World board content (seeded locations)
  - name: Worlds
    description: Distinct world packs derived from locations
  - name: Tables
    description: |
      Matchmaking lobby (public pool join, private create, join-by-code, ready, leave).
      Phase 20: private lobbies use an 8-char invite code; sealed once the game starts.
  - name: Games
    description: Authoritative M1 game state (Phase 6+)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency ping
      description: |
        Returns dependency status. HTTP 200 when status is `ok`;
        HTTP 503 when status is `degraded` (body still a HealthResponse).
      tags:
        - Health
      responses:
        "200":
          description: Service and dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service up but a dependency failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/signup/start:
    post:
      operationId: signupStart
      summary: Start signup by email
      description: |
        Accepts an email and sends a 6-digit verification code via SMTP.
        Always returns 204 when the request is well-formed (anti-enumeration).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupStartRequest"
      responses:
        "204":
          description: Verification email sent if the address is eligible
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Mail or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/verify:
    post:
      operationId: signupVerify
      summary: Verify email with 6-digit code
      description: On success returns a short-lived signup token for password + profile steps.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupVerifyRequest"
      responses:
        "200":
          description: Email verified; signup token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupVerifyResponse"
        "400":
          description: Invalid request or code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/password:
    post:
      operationId: signupSetPassword
      summary: Set password during signup
      description: Requires Bearer signup token from `/auth/signup/verify`.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupPasswordRequest"
      responses:
        "204":
          description: Password set
        "400":
          description: Weak or invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid signup token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/profile:
    post:
      operationId: signupCompleteProfile
      summary: Finish profile and start session
      description: |
        Requires Bearer signup token. Sets username + country and returns an opaque session token.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupProfileRequest"
      responses:
        "200":
          description: Profile complete; session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid username or country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid signup token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/status:
    get:
      operationId: signupStatus
      summary: Signup progress for a signup Bearer token
      description: |
        Used to resume onboarding. Only `passwordSet: true` is durable progress;
        OTP-only accounts should discard the draft and stay on login.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current signup progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupStatusResponse"
        "401":
          description: Missing or invalid signup token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      summary: Login with email and password
      description: |
        Requires verified email and a password. When the profile is incomplete,
        returns `needsProfile: true` plus a reissued signup token instead of a session.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated, or resume profile step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials or incomplete signup (no password yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked (idempotent if already gone)
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/start:
    post:
      operationId: passwordResetStart
      summary: Start password reset by email
      description: |
        Sends a 6-digit code only when the email belongs to a fully registered user.
        Response `sent` is false when no mail was sent (unknown or incomplete account).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetStartRequest"
      responses:
        "200":
          description: Whether a reset email was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetStartResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Mail or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/verify:
    post:
      operationId: passwordResetVerify
      summary: Verify password-reset code
      description: On success returns a short-lived reset token for setting a new password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetVerifyRequest"
      responses:
        "200":
          description: Code verified; reset token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetVerifyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/confirm:
    post:
      operationId: passwordResetConfirm
      summary: Set a new password after reset verify
      description: |
        Requires Bearer reset token. Updates the password and revokes all existing login sessions.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password updated; sessions revoked
        "400":
          description: Weak or invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      summary: Current user profile
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchMe
      summary: Update current user profile fields
      description: Phase 19.0 — change username (same rules as signup profile).
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/avatar:
    post:
      operationId: uploadAvatar
      summary: Upload profile avatar
      description: |
        Phase 19.0 — multipart field `file` (JPEG/PNG/WebP, max 1 MiB).
        Stored in Supabase Storage; returns updated UserProfile with `avatarUrl`.
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAvatar
      summary: Remove profile avatar
      description: Phase 19.0 — clears `avatarUrl` and deletes the Storage object.
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /worlds:
    get:
      operationId: listWorlds
      summary: List world packs
      description: Distinct `worldId` values with location counts from the `locations` collection.
      tags:
        - Worlds
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worlds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldsResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables:
    post:
      operationId: createTable
      summary: Create a private lobby (Start a game)
      description: |
        Phase 20 — creates a **private** lobby for `worldId`, seats the host, and
        returns a table snapshot including an 8-character `inviteCode` (Crockford
        Base32, case-insensitive). Private tables are excluded from public
        matchmaking (`POST /tables/join`). Friends join via `POST /tables/join-code`.
        Connect to `GET /ws/tables/{tableId}?token=` for live seat/ready updates.
        Invite codes are valid only while `status` is `lobby`; after all-Ready
        starts the game the lobby is sealed (no late join).
      tags:
        - Tables
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "200":
          description: Private lobby created and host seated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid world
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/join:
    post:
      operationId: joinTable
      summary: Join a World matchmaking lobby
      description: |
        Finds an open **public** lobby for `worldId` (or creates one), seats the caller,
        and returns the table snapshot. Private tables (Phase 20) are never matched here.
        Connect to `GET /ws/tables/{tableId}?token=`
        for live seat/ready updates. Messages: client `{type:ready|leave|ping}`,
        server `{type:state|started|pong|error}`.
      tags:
        - Tables
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTableRequest"
      responses:
        "200":
          description: Seated in lobby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid world
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Table full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/join-code:
    post:
      operationId: joinTableByCode
      summary: Join a private lobby by invite code
      description: |
        Phase 20 — seats the caller into the lobby identified by `inviteCode`
        (8-char Crockford Base32; lookup is case-insensitive). Fails if the code
        is unknown, the table is full, or the lobby is no longer joinable
        (`status` is not `lobby` — e.g. game already started). Returns the table
        snapshot; connect to `GET /ws/tables/{tableId}?token=` for live updates.
      tags:
        - Tables
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTableByCodeRequest"
      responses:
        "200":
          description: Seated in lobby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid invite code format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Table full or lobby already started (sealed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}:
    get:
      operationId: getTable
      summary: Get table snapshot
      tags:
        - Tables
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}/ready:
    post:
      operationId: setTableReady
      summary: Toggle Ready for the local seat
      description: Requires ≥2 seated. When every seated player is Ready, status becomes `starting` and WS emits `started`.
      tags:
        - Tables
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTableReadyRequest"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Need more players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not seated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}/leave:
    post:
      operationId: leaveTable
      summary: Leave lobby (frees seat immediately)
      tags:
        - Tables
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated table after leave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}:
    get:
      operationId: getGame
      summary: Get M1 game snapshot
      description: |
        Authoritative game state (players, MeetCoin balances, pin boardIndex, whose turn).
        Created when a lobby reaches all-Ready (Phase 6.0).
        Live updates: connect to `GET /ws/games/{gameId}?token=` (same auth as table lobby WS);
        server pushes `{ "type": "state", "game": Game }` after roll / end-turn / resign / buy.
        Phase 7.5: if the game WS closes, the server starts a silent disconnect hold
        (`GAME_DISCONNECT_HOLD`, default `3m`); reconnect cancels; expire → same Resign as Leave.
        Presence WS / WebRTC drops do **not** resign.
        Board presence (Phase 7.0–7.4): `GET /ws/presence/board/{gameId}?token=` — WebRTC signaling +
        Pion SFU PeerConnection; room id `board:{gameId}`;
        STUN `stun:stun.l.google.com:19302`.
        Hub presence (Phase 8.0): `GET /ws/presence/hub/{hubId}?token=` — same signaling/SFU/DC family;
        `hubId` is URL-encoded (e.g. `hub%3Aafrica-1%3Alagos`); room id from `HubRoomID` → `hub:{…}`.
        Auth: any logged-in user (not required to be seated in a game — cross-table meet).
        Enter hub: client leaves board presence room and joins hub; Leave hub: reverse. Game WS stays up.
        Phase 8.2: `POST /games/{gameId}/enter-hub` `{hubId, hubRevision?}` / `leave-hub` sets `GamePlayer.hubId`
        (leave bumps `hubRevision`; enter with an older revision is ignored — Phase 8.4). Board peers show `Name(in CODE)`.
        fans out on game WS so board peers can show `Name(in CODE)` (presence linger unchanged).
        Phase 8.1: same pose JSON on hub rooms; clients publish ~10 Hz hub-local 0..1 and interpolate remotes.
        Messages: client `{type:offer|ice|ping}`, server `{type:welcome|answer|ice|peer-joined|peer-left|pong|error}`.
        Phase 9.0a: `welcome` / `peer-joined` / roster peers include optional `country` (ISO 3166-1 alpha-2).
        DataChannel label `presence`. Pose fan-out: client sends JSON
        `{type:"pose",userId?,username?,x,y,rot?,t?}` (board-normalized 0..1); SFU stamps
        `userId`/`username`, rate-limits ~20 Hz/peer, and forwards to other peers' open DCs.
        Collision stays client-side (7.3 skipped). Pins stay on game WS only (dual presence).
        Clients interpolate remotes and draw presence avatars separately from game pins.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/roll:
    post:
      operationId: rollDice
      summary: Roll dice on your turn
      description: |
        Server rolls 2d6 and moves the caller's pin (unless third consecutive doubles).
        Awards pass-GO MeetCoin when applicable. Does **not** advance turn (Phase 6.2).
        Doubles → may roll again; non-doubles or third doubles → must `end-turn`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not your turn, must end turn first, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/end-turn:
    post:
      operationId: endTurn
      summary: End your turn
      description: |
        Advances to the next seat (Phase 6.2). Allowed only when `turnPhase` is `awaiting_end`
        (after a non-doubles roll, or after third consecutive doubles).
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not your turn, must roll first, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/resign:
    post:
      operationId: resignGame
      summary: Resign and leave the game
      description: |
        Phase 6.2c — voluntary leave mid-game counts as resigning.
        Marks the caller `resigned`, wipes deeds/buildings/GOOJF to the Bank (Phase 14.0),
        skips them for turns, broadcasts state. If a creditor was still owed, the Bank
        credits that player the remaining debt. If only one active player remains, they win.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already resigned or game inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/bankrupt:
    post:
      operationId: bankruptGame
      summary: Declare bankruptcy
      description: |
        Phase 14.0 — caller must have negative MeetCoin. Eliminates that player only:
        deeds become unowned, buildings cleared, GOOJF returned to deck bottoms,
        Bank credits any remaining owed amount to the creditor. Table continues unless
        one active player remains (they win).
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in debt, already out, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/debt-pay/start:
    post:
      operationId: startDebtPay
      summary: Start the 2-minute debt raise-funds window
      description: |
        Phase 14.0 — current player with negative cash opens a 2:00 window to sell
        buildings and mortgage (trade blocked). Turn clock pauses. Expiry or no
        raisable assets → auto-bankrupt. Settling cash to ≥ 0 clears the window.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player / not your turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in debt, debt-pay already active, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/buy:
    post:
      operationId: buyProperty
      summary: Buy the unowned space you landed on
      description: |
        Phase 6.4 — purchase at list price when the current player occupies an unowned
        property / airport / utility after landing. To decline, call `start-auction` (Phase 13.0).
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not your turn, not buyable, already owned, cannot afford, auction active, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/start-auction:
    post:
      operationId: startAuction
      summary: Decline list-price buy and start a bank auction
      description: |
        Phase 13.0 — current player with an open buyOffer starts a turn-based auction.
        If cash < list price, the server auto-starts an auction on land (no buyOffer).
        All personal time banks pause for the whole auction; each bidder gets a 60s clock.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot with auction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No buy offer, auction already active, not your turn, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/auction/bid:
    post:
      operationId: auctionBid
      summary: Place a bid on the active auction
      description: |
        Phase 13.0 — only the current auction bidder. Amount must be ≥ highBid+1 (or ≥ 1 if no bids)
        and ≤ the bidder's cash. High bidder then sits out until outbid.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: MeetCoin bid (≥ minBid)
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not auction turn, bid too low, cannot afford, no auction, or already folded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/auction/fold:
    post:
      operationId: auctionFold
      summary: Fold from the active auction
      description: |
        Phase 13.0 — only the current auction bidder. If the high bidder later folds after being
        outbid, high reverts to the latest bid among remaining players. Last non-folded wins.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not auction turn, no auction, or already folded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/trade/propose:
    post:
      operationId: proposeTrade
      summary: Propose a player-to-player trade
      description: |
        Phase 13.2 — current player only. One open trade table-wide. Both sides must be
        non-empty; cash-for-cash alone is rejected (at least one deed or GOOJF on either side).
        Deeds with houses/hotels cannot be traded. Pauses the proposer's 3-minute turn clock
        while the target has 60s to accept/decline (auto-decline on timeout). Fans out via WS.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeProposeBody"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not your turn, auction/trade active, or cannot afford
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/trade/accept:
    post:
      operationId: acceptTrade
      summary: Accept the open trade offer
      description: |
        Phase 13.2 — trade target only. If any transferred deed is mortgaged, body must
        include `mortgageAction` (`redeem_all` | `leave_all`). Redeem cost is mortgage + 10%.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeAcceptBody"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Missing mortgageAction when required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the trade target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No trade, auction active, or cannot afford redeem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/trade/decline:
    post:
      operationId: declineTrade
      summary: Decline the open trade offer
      description: Phase 13.2 — trade target only. Resumes the proposer's turn clock.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the trade target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No open trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/build:
    post:
      operationId: buildOnDeed
      summary: Buy one house or hotel step on an owned city
      description: |
        Phase 11.1 — current player only (awaiting_roll or awaiting_end). Body selects the
        deed (`boardIndex`). Requires full color group, even-build, cash ≥ seed `houseCost`,
        and no mortgaged deed in the set. One step per call (`houses` 0→1…→5; 5 = hotel).
        Fans out updated game via WebSocket `state`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid body or boardIndex
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Not your turn, must settle, not buildable, not owner, no monopoly,
            uneven build, max built, mortgaged set, cannot afford, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/sell-building:
    post:
      operationId: sellBuilding
      summary: Sell one house or hotel step back to the bank
      description: |
        Phase 11.2 — current player only. Body selects the deed (`boardIndex`).
        Refund = floor(houseCost / 2). Requires houses ≥ 1, full color group, and
        even-sell (sell from the tallest deed first). **Allowed during pendingPayment**
        so the player can raise funds; refund is applied toward the outstanding debt.
        One step per call. Fans out via WebSocket `state`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellBuildingRequest"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid body or boardIndex
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Not your turn, not buildable, not owner, no monopoly, uneven sell,
            nothing to sell, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/mortgage:
    post:
      operationId: mortgageDeed
      summary: Mortgage an owned deed for half list price
      description: |
        Phase 11.3 — current player only. Body selects the deed (`boardIndex`).
        Payout = floor(listPrice / 2). Cities require all buildings on the color group
        sold first. Allowed during pendingPayment (raise funds; payout applies to debt).
        Mortgaged deeds collect no rent. Fans out via WebSocket `state`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MortgageRequest"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid body or boardIndex
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Not your turn, cannot mortgage, not owner, already mortgaged,
            must sell buildings, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/redeem:
    post:
      operationId: redeemDeed
      summary: Unmortgage a deed (mortgage value + 10%)
      description: |
        Phase 11.3 — current player only. Cost = floor(listPrice/2) + 10% of that
        mortgage value. Blocked while pendingPayment (settle debt first).
        Fans out via WebSocket `state`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid body or boardIndex
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Not your turn, must settle, not mortgaged, not owner, cannot afford, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/pay-jail-fine:
    post:
      operationId: payJailFine
      summary: Pay 100 MeetCoin to leave Jail
      description: |
        Phase 12.1 — current player only, while `inJail`. Deducts **100** MeetCoin,
        clears `inJail` / `jailTurns`, sets `turnPhase` to `awaiting_roll` so they
        can Roll and move. Does not move the pin by itself.
        Fans out via WebSocket `state`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Not your turn, not in jail, must settle, cannot afford, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/use-jail-card:
    post:
      operationId: useJailCard
      summary: Use a Get Out of Jail Free card
      description: |
        Phase 12.1 — current player only, while `inJail` and `getOutOfJailFree` ≥ 1.
        Decrements the card count, leaves Jail, sets `awaiting_roll` (then Roll to move).
        Cards are drawn in Phase 12.2+; this endpoint is ready when a card is held.
        Fans out via WebSocket `state`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Not your turn, not in jail, no card, must settle, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/pin-color:
    post:
      operationId: setPinColor
      summary: Sync pin color to avatar accent
      description: |
        Updates the caller's `pinColor` so board pins, HUD dots, and ownership chips
        match their local avatar / joystick accent. Idempotent when unchanged.
        Rejects colors already taken by another player in the same game.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPinColorRequest"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid pinColor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/enter-hub:
    post:
      operationId: enterHub
      summary: Mark player as inside a location hub
      description: |
        Phase 8.2 — sets the caller's `hubId` so board peers can show an in-hub badge
        (e.g. `Needrima(in LOS)`). Presence room switch remains on the client (8.0);
        this only fans out via game WS state. Idempotent when already in the same hub.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterHubRequest"
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid hubId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Inactive game or already resigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/leave-hub:
    post:
      operationId: leaveHub
      summary: Clear in-hub marker
      description: |
        Phase 8.2 — clears the caller's `hubId` so board peers see them back on the board.
        Idempotent when already clear. Does not resign or drop the game WS.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations:
    get:
      operationId: listLocations
      summary: List locations for a world
      description: Returns board spaces for `worldId`, sorted by `boardIndex`.
      tags:
        - Locations
      security:
        - bearerAuth: []
      parameters:
        - name: worldId
          in: query
          required: true
          schema:
            type: string
            example: africa-1
          description: World pack id (e.g. africa-1)
      responses:
        "200":
          description: Locations for the world
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationsResponse"
        "400":
          description: Missing worldId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/by-slug:
    get:
      operationId: getLocationBySlug
      summary: Get location by world and slug
      tags:
        - Locations
      security:
        - bearerAuth: []
      parameters:
        - name: worldId
          in: query
          required: true
          schema:
            type: string
            example: africa-1
        - name: slug
          in: query
          required: true
          schema:
            type: string
            example: accra
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Missing worldId or slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/{locationId}:
    get:
      operationId: getLocationById
      summary: Get location by Mongo id
      tags:
        - Locations
      security:
        - bearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
          description: MongoDB ObjectId hex string
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque session token (or short-lived signup token) stored in Redis
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - mongo
        - redis
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall health
        mongo:
          type: string
          enum: [ok, error]
          description: MongoDB ping result
        redis:
          type: string
          enum: [ok, error]
          description: Redis ping result
        version:
          type: string
          description: Optional build/version label
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable detail
    SignupStartRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Account email address
    SignupVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6-digit verification code from email
    SignupVerifyResponse:
      type: object
      additionalProperties: false
      required:
        - signupToken
      properties:
        signupToken:
          type: string
          description: Short-lived Bearer token for password + profile steps
    SignupPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    SignupProfileRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - country
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[A-Za-z0-9_]{3,20}$"
          description: Unique username (letters, digits, underscore)
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code (uppercase)
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - needsProfile
        - user
      properties:
        needsProfile:
          type: boolean
          description: True when password is set but username/country are missing
        token:
          type: string
          nullable: true
          description: Opaque session token when needsProfile is false
        signupToken:
          type: string
          nullable: true
          description: Reissued signup Bearer token when needsProfile is true
        user:
          $ref: "#/components/schemas/UserProfile"
    SignupStatusResponse:
      type: object
      additionalProperties: false
      required:
        - email
        - passwordSet
        - profileComplete
      properties:
        email:
          type: string
          format: email
        passwordSet:
          type: boolean
        profileComplete:
          type: boolean
    PasswordResetStartRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordResetStartResponse:
      type: object
      additionalProperties: false
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: True when a reset code email was sent
    PasswordResetVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"
    PasswordResetVerifyResponse:
      type: object
      additionalProperties: false
      required:
        - resetToken
      properties:
        resetToken:
          type: string
          description: Short-lived Bearer token for password reset confirm
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Opaque session token (store in expo-secure-store)
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - emailVerified
        - profileComplete
      properties:
        id:
          type: string
          description: User id
        email:
          type: string
          format: email
        username:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 when set
        avatarUrl:
          type: string
          nullable: true
          description: Public Supabase Storage URL when a profile photo is set (Phase 19.0)
        emailVerified:
          type: boolean
        profileComplete:
          type: boolean
          description: True when username and country are set
    PatchMeRequest:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
          description: Unique username (letters, digits, underscore), 3–20 chars
    WorldSummary:
      type: object
      additionalProperties: false
      required:
        - worldId
        - count
      properties:
        worldId:
          type: string
          example: africa-1
        count:
          type: integer
          description: Number of location documents in this world
    WorldsResponse:
      type: object
      additionalProperties: false
      required:
        - worlds
      properties:
        worlds:
          type: array
          items:
            $ref: "#/components/schemas/WorldSummary"
    JoinTableRequest:
      type: object
      additionalProperties: false
      required:
        - worldId
      properties:
        worldId:
          type: string
          example: africa-1
    CreateTableRequest:
      type: object
      additionalProperties: false
      required:
        - worldId
      properties:
        worldId:
          type: string
          description: World pack for the private lobby (Phase 20 Start a game)
          example: africa-1
    JoinTableByCodeRequest:
      type: object
      additionalProperties: false
      required:
        - inviteCode
      properties:
        inviteCode:
          type: string
          description: |
            Phase 20 — 8-character Crockford Base32 invite code from a private lobby
            (`0-9A-HJKMNPQRSTVWXYZ`; case-insensitive).
          minLength: 8
          maxLength: 8
          pattern: "^[0-9A-Ha-hJjKkMmNnPpQqRrSsTtVvWwXxYyZz]{8}$"
          example: "A1B2C3D4"
    SetTableReadyRequest:
      type: object
      additionalProperties: false
      required:
        - ready
      properties:
        ready:
          type: boolean
    SetPinColorRequest:
      type: object
      additionalProperties: false
      required:
        - pinColor
      properties:
        pinColor:
          type: string
          description: Hex accent `#RRGGBB` matching the player's avatar/joystick color
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#6B3FA0"
    BuildRequest:
      type: object
      additionalProperties: false
      required:
        - boardIndex
      properties:
        boardIndex:
          type: integer
          description: Board space to build one house/hotel step on (must be an owned city)
          minimum: 0
          maximum: 39
    SellBuildingRequest:
      type: object
      additionalProperties: false
      required:
        - boardIndex
      properties:
        boardIndex:
          type: integer
          description: Board space to sell one house/hotel step from (must be an owned city with buildings)
          minimum: 0
          maximum: 39
    MortgageRequest:
      type: object
      additionalProperties: false
      required:
        - boardIndex
      properties:
        boardIndex:
          type: integer
          description: Owned buyable space to mortgage (half list price)
          minimum: 0
          maximum: 39
    RedeemRequest:
      type: object
      additionalProperties: false
      required:
        - boardIndex
      properties:
        boardIndex:
          type: integer
          description: Owned mortgaged space to redeem (mortgage value + 10%)
          minimum: 0
          maximum: 39
    EnterHubRequest:
      type: object
      additionalProperties: false
      required:
        - hubId
      properties:
        hubId:
          type: string
          description: Location hub id (e.g. `hub:africa-1:lagos`)
          example: hub:africa-1:lagos
        hubRevision:
          type: integer
          format: int64
          description: |
            Phase 8.4 — client's observed `GamePlayer.hubRevision` at enter time.
            If older than the server value (e.g. LeaveHub won the race), the enter is ignored.
    TableSeat:
      type: object
      additionalProperties: false
      required:
        - seatIndex
        - ready
        - holding
      properties:
        seatIndex:
          type: integer
          minimum: 0
          maximum: 5
        userId:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        pinColor:
          type: string
          nullable: true
          description: Unique seat accent assigned on lobby join (`#RRGGBB`)
          pattern: "^#[0-9A-Fa-f]{6}$"
        avatarUrl:
          type: string
          nullable: true
          description: Public profile photo URL from the user profile (Phase 19.0)
        ready:
          type: boolean
        holding:
          type: boolean
        holdEndsAt:
          type: string
          format: date-time
          nullable: true
    Table:
      type: object
      additionalProperties: false
      required:
        - id
        - worldId
        - status
        - private
        - seats
        - expiresAt
      properties:
        id:
          type: string
        worldId:
          type: string
        status:
          type: string
          enum: [lobby, starting, in_game]
        private:
          type: boolean
          description: |
            Phase 20 — `true` for invite-only lobbies created via `POST /tables`.
            Private tables are excluded from public matchmaking.
        inviteCode:
          type: string
          nullable: true
          description: |
            Phase 20 — 8-character Crockford Base32 code for private lobbies.
            Null on public pool tables. Valid for join only while `status` is `lobby`.
          minLength: 8
          maxLength: 8
          example: "A1B2C3D4"
        gameId:
          type: string
          nullable: true
          description: Set when lobby starts an M1 game (Phase 6+)
        expiresAt:
          type: string
          format: date-time
          description: |
            Phase 20.6 — when an unstarted lobby is swept (`createdAt` + 15 minutes).
            Clients should treat join/ready as failed after this instant; the sweeper
            deletes the table and may push WebSocket `{type:expired}`.
        seats:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/TableSeat"
    GamePlayer:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - seatIndex
        - turnOrder
        - cash
        - boardIndex
        - pinColor
        - resigned
        - timeRemainingMs
        - turnTimeouts
        - inJail
        - jailTurns
        - getOutOfJailFree
      properties:
        userId:
          type: string
        username:
          type: string
        seatIndex:
          type: integer
        turnOrder:
          type: integer
        cash:
          type: integer
          description: MeetCoin balance
        boardIndex:
          type: integer
          description: Rules pin position (0 = GO)
        pinColor:
          type: string
          description: Hex accent for the pin
        resigned:
          type: boolean
          description: Left mid-game or turn-timeout / resign eliminated; skipped for turns
        timeRemainingMs:
          type: integer
          format: int64
          description: |
            Phase 13.2 — current player's remaining turn clock in ms (fresh 3 minutes each
            time they become current). Live while their turn clock is draining; paused
            during auction and while a trade reply is pending. Other players' values are
            unused for HUD (panel shows current player only).
        turnTimeouts:
          type: integer
          minimum: 0
          description: |
            Phase 13.2 — how many times this player's 3m turn clock hit 0.
            After 2, the player auto-resigns (forfeit).
        country:
          type: string
          description: |
            Phase 9.0a — ISO 3166-1 alpha-2 from the user profile (enriched on read;
            not stored on the game document).
        avatarUrl:
          type: string
          description: |
            Phase 19.0 — public profile photo URL from the user profile (enriched on read;
            not stored on the game document).
        hubId:
          type: string
          nullable: true
          description: |
            Phase 8.2 — set while the player is inside a location hub
            (e.g. `hub:africa-1:lagos`); null/omitted when on the board.
        hubRevision:
          type: integer
          format: int64
          description: |
            Phase 8.4 — monotonic counter bumped on leave-hub / resign.
            Clients pass the observed value on enter-hub so a late enter cannot restick hubId.
        inJail:
          type: boolean
          description: |
            Phase 12.0 — true when the player was sent to Jail (Go to Jail tile,
            three doubles, or later a card). False when merely Just Visiting on
            the Jail tile (board index 10).
        jailTurns:
          type: integer
          minimum: 0
          description: |
            Phase 12.0/12.1 — count of failed jail-exit attempts this stay.
            Reset to 0 on jail entry; exit pay/doubles/GOOJF in 12.1.
        getOutOfJailFree:
          type: integer
          minimum: 0
          description: |
            Phase 12.0 schema — number of Get Out of Jail Free cards held.
            Drawn from Chance/Chest in 12.2+; always 0 until then.
    GameLastRoll:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - die1
        - die2
        - total
        - fromIndex
        - toIndex
        - passedGo
        - passGoAmount
        - isDoubles
        - doublesStreak
        - thirdDoubles
      properties:
        userId:
          type: string
        username:
          type: string
        die1:
          type: integer
          minimum: 1
          maximum: 6
        die2:
          type: integer
          minimum: 1
          maximum: 6
        total:
          type: integer
        fromIndex:
          type: integer
        toIndex:
          type: integer
        passedGo:
          type: boolean
        passGoAmount:
          type: integer
          description: MeetCoin awarded this roll for passing/landing on GO
        isDoubles:
          type: boolean
        doublesStreak:
          type: integer
          description: Consecutive doubles count after this roll (1–3)
        thirdDoubles:
          type: boolean
          description: |
            True when three doubles sent the player to Jail (Phase 12.0).
            Pin moves to Jail; turn ends (awaiting_end).
    GameDeed:
      type: object
      additionalProperties: false
      required:
        - boardIndex
        - ownerUserId
        - ownerUsername
        - houses
        - mortgaged
      properties:
        boardIndex:
          type: integer
        ownerUserId:
          type: string
        ownerUsername:
          type: string
        houses:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            Building count on this deed (Phase 11.0).
            0 = undeveloped; 1–4 = houses; 5 = hotel. Always 0 until build (11.1).
        mortgaged:
          type: boolean
          description: |
            Whether this deed is mortgaged (Phase 11.3). Mortgaged deeds collect no rent.
            Building on a color set is blocked if any deed in the set is mortgaged.
    GameLastPayment:
      type: object
      additionalProperties: false
      required:
        - kind
        - fromUserId
        - fromUsername
        - amount
        - boardIndex
        - spaceName
        - paidInFull
      properties:
        kind:
          type: string
          enum: [rent, tax, jail_fine, card]
        fromUserId:
          type: string
        fromUsername:
          type: string
        toUserId:
          type: string
          description: Empty or omitted when paid to the Bank (tax)
        toUsername:
          type: string
          description: Landlord username, or Bank for tax
        amount:
          type: integer
          description: MeetCoin transferred this event (may be partial)
        boardIndex:
          type: integer
        spaceName:
          type: string
        paidInFull:
          type: boolean
          description: False when cash was insufficient; see pendingPayment
    GamePendingPayment:
      type: object
      additionalProperties: false
      required:
        - kind
        - amount
        - boardIndex
        - spaceName
      properties:
        kind:
          type: string
          enum: [rent, tax, card, jail]
        amount:
          type: integer
          description: Remaining MeetCoin owed (matches −cash while indebted)
        fromUserId:
          type: string
          description: Debtor user id (Phase 14.0)
        fromUsername:
          type: string
        toUserId:
          type: string
          description: Creditor user id; empty = Bank
        toUsername:
          type: string
        boardIndex:
          type: integer
        spaceName:
          type: string
    GameDebtPay:
      type: object
      additionalProperties: false
      required:
        - userId
        - deadline
        - remainingMs
      properties:
        userId:
          type: string
        username:
          type: string
        deadline:
          type: string
          format: date-time
        remainingMs:
          type: integer
          format: int64
    GameLastBankruptcy:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - reason
      properties:
        userId:
          type: string
        username:
          type: string
        reason:
          type: string
          enum: [declare, auto_timeout, auto_insolvent, resign, turn_timeout]
        owedToUserId:
          type: string
        owedToUsername:
          type: string
        bankPaid:
          type: integer
          description: MeetCoin the Bank credited to the creditor on wipe
    GameLastCard:
      type: object
      additionalProperties: false
      required:
        - deck
        - cardId
        - title
        - userId
        - username
      properties:
        deck:
          type: string
          enum: [chance, community_chest]
        cardId:
          type: string
          description: Stable catalog id (e.g. chance_advance_go)
        title:
          type: string
          description: Display title for the card reveal UI
        userId:
          type: string
        username:
          type: string
        cashDelta:
          type: integer
          description: >
            Signed MeetCoin face amount for this card (credits positive, debits
            negative). Full obligation for pay-each / birthday / repairs even if
            cash was short. Omitted or 0 when the card has no cash effect
            (move, jail, GOOJF, go back).
    GameBuyOffer:
      type: object
      additionalProperties: false
      required:
        - boardIndex
        - slug
        - name
        - kind
        - price
      properties:
        boardIndex:
          type: integer
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [property, airport, utility]
          description: Buyable space kind. Air hubs use `airport`.
        price:
          type: integer
          description: List price in MeetCoin
    GameAuctionEvent:
      type: object
      additionalProperties: false
      required:
        - kind
        - userId
        - username
      properties:
        kind:
          type: string
          enum: [bid, fold, auto_bid, auto_fold]
        userId:
          type: string
        username:
          type: string
        amount:
          type: integer
          description: MeetCoin for bid / auto_bid; omitted for folds
    GameAuction:
      type: object
      additionalProperties: false
      required:
        - boardIndex
        - slug
        - name
        - kind
        - listPrice
        - highBid
        - currentBidderUserId
        - minBid
        - bidDeadline
        - foldedUserIds
        - history
        - startedByUserId
      properties:
        boardIndex:
          type: integer
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [property, airport, utility]
          description: Buyable space kind. Air hubs use `airport`.
        listPrice:
          type: integer
        highBid:
          type: integer
          description: 0 when no bids yet
        highBidderUserId:
          type: string
        highBidderUsername:
          type: string
        currentBidderUserId:
          type: string
        currentBidderUsername:
          type: string
        minBid:
          type: integer
          description: Minimum next bid (1 if highBid is 0, else highBid+1)
        bidDeadline:
          type: string
          format: date-time
          description: UTC instant when the current bidder's 60s clock expires
        foldedUserIds:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/GameAuctionEvent"
        startedByUserId:
          type: string
    GameLastAuction:
      type: object
      additionalProperties: false
      required:
        - boardIndex
        - spaceName
        - void
      properties:
        boardIndex:
          type: integer
        spaceName:
          type: string
        winnerUserId:
          type: string
        winnerUsername:
          type: string
        amount:
          type: integer
          description: MeetCoin paid by winner (omitted when void)
        void:
          type: boolean
          description: true when nobody could buy — deed stays unowned
    GameLastTrade:
      type: object
      additionalProperties: false
      required:
        - fromUserId
        - fromUsername
        - toUserId
        - toUsername
        - outcome
        - settledAt
      properties:
        fromUserId:
          type: string
        fromUsername:
          type: string
        toUserId:
          type: string
        toUsername:
          type: string
        outcome:
          type: string
          enum: [accepted, declined]
          description: accepted by target, or declined (manual or reply timeout)
        settledAt:
          type: string
          format: date-time
          description: UTC instant the offer settled (dedupe key for toasts)
    TradeSide:
      type: object
      additionalProperties: false
      properties:
        cash:
          type: integer
          minimum: 0
          description: MeetCoin included on this side
        boardIndexes:
          type: array
          items:
            type: integer
          description: Deed board indexes included on this side
        getOutOfJailFree:
          type: integer
          minimum: 0
          description: Count of GOOJF cards included on this side
    TradeProposeBody:
      type: object
      additionalProperties: false
      required:
        - toUserId
        - give
        - take
      properties:
        toUserId:
          type: string
        give:
          description: Assets the proposer gives
          allOf:
            - $ref: "#/components/schemas/TradeSide"
        take:
          description: Assets the target gives
          allOf:
            - $ref: "#/components/schemas/TradeSide"
    TradeAcceptBody:
      type: object
      additionalProperties: false
      properties:
        mortgageAction:
          type: string
          enum: [redeem_all, leave_all]
          description: |
            Required when any deed in the trade is mortgaged. redeem_all charges
            mortgage+10% to each receiver for mortgaged deeds they receive.
    GameTrade:
      type: object
      additionalProperties: false
      required:
        - fromUserId
        - fromUsername
        - toUserId
        - toUsername
        - give
        - take
        - replyDeadline
      properties:
        fromUserId:
          type: string
        fromUsername:
          type: string
        toUserId:
          type: string
        toUsername:
          type: string
        give:
          $ref: "#/components/schemas/TradeSide"
        take:
          $ref: "#/components/schemas/TradeSide"
        replyDeadline:
          type: string
          format: date-time
          description: UTC instant when the target's 60s reply clock expires
    GameLastForfeit:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - reason
      properties:
        userId:
          type: string
        username:
          type: string
        reason:
          type: string
          enum: [turn_strike, turn_timeout, resign]
          description: |
            turn_strike — first 3m clock expiry (still in game);
            turn_timeout — second expiry (kicked);
            resign — manual leave
        strikes:
          type: integer
          minimum: 0
          description: Turn-timeout count after this event (1 or 2); 0 for resign
    Game:
      type: object
      additionalProperties: false
      required:
        - id
        - tableId
        - worldId
        - status
        - players
        - currentTurn
        - currentUserId
        - currentUsername
        - passGoBonus
        - currency
        - turnPhase
        - doublesStreak
        - canRoll
        - canEndTurn
        - canBuy
        - canStartAuction
        - canProposeTrade
        - canPayJailFine
        - canUseJailCard
        - canBankrupt
        - canStartDebtPay
        - deeds
      properties:
        id:
          type: string
        tableId:
          type: string
        worldId:
          type: string
        status:
          type: string
          enum: [active, finished]
        players:
          type: array
          items:
            $ref: "#/components/schemas/GamePlayer"
        currentTurn:
          type: integer
          description: turnOrder of the active player
        currentUserId:
          type: string
        currentUsername:
          type: string
        passGoBonus:
          type: integer
          description: MeetCoin granted when passing GO
        currency:
          type: string
          example: MeetCoin
        turnPhase:
          type: string
          enum: [awaiting_roll, awaiting_end]
        doublesStreak:
          type: integer
        canRoll:
          type: boolean
          description: |
            Phase 12.1 — while in Jail, true only if jailTurns < 3 (try doubles).
            After 3 failed attempts, false until pay/card. False while a trade is open (13.2).
        canEndTurn:
          type: boolean
          description: |
            Phase 14.0 — true in awaiting_end even while cash is negative (End allowed).
            False during auction, trade, or active debt-pay window.
        canBuy:
          type: boolean
          description: Current player may buy the space they just landed on at list price (Phase 6.4)
        canStartAuction:
          type: boolean
          description: |
            Phase 13.0 — current player has a buyOffer (can afford list price) and may start a bank auction.
        canProposeTrade:
          type: boolean
          description: |
            Phase 13.2 — current player may open a trade (not during auction/debt/open trade).
        canPayJailFine:
          type: boolean
          description: |
            Phase 12.1 — current player is in Jail, can afford 100 MeetCoin, and may pay to leave.
        canUseJailCard:
          type: boolean
          description: |
            Phase 12.1 — current player is in Jail and holds at least one Get Out of Jail Free card.
        canBankrupt:
          type: boolean
          description: Phase 14.0 — current player has negative cash and may declare bankruptcy
        canStartDebtPay:
          type: boolean
          description: |
            Phase 14.0 — current player is in debt, has raisable assets, and may open the 2:00 Pay window
        buyOffer:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GameBuyOffer"
        auction:
          nullable: true
          description: Phase 13.0 — active bank auction (null when none)
          allOf:
            - $ref: "#/components/schemas/GameAuction"
        lastAuction:
          nullable: true
          description: Phase 13.0 — most recent auction settle/void for toasts
          allOf:
            - $ref: "#/components/schemas/GameLastAuction"
        trade:
          nullable: true
          description: Phase 13.2 — open trade offer (null when none)
          allOf:
            - $ref: "#/components/schemas/GameTrade"
        lastTrade:
          nullable: true
          description: Phase 13.3 — most recent trade accept/decline for toasts
          allOf:
            - $ref: "#/components/schemas/GameLastTrade"
        lastForfeit:
          nullable: true
          description: Phase 13.2 — most recent forfeit for toasts
          allOf:
            - $ref: "#/components/schemas/GameLastForfeit"
        deeds:
          type: array
          items:
            $ref: "#/components/schemas/GameDeed"
        lastRoll:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GameLastRoll"
        lastPayment:
          nullable: true
          description: Most recent rent/tax auto-collect (Phase 6.5)
          allOf:
            - $ref: "#/components/schemas/GameLastPayment"
        pendingPayment:
          nullable: true
          description: |
            Phase 14.0 — debt metadata while debtor cash is negative. Roll blocked for debtor;
            End allowed on the landing turn. Amount matches −cash.
          allOf:
            - $ref: "#/components/schemas/GamePendingPayment"
        debtPay:
          nullable: true
          description: Phase 14.0 — active 2:00 raise-funds window
          allOf:
            - $ref: "#/components/schemas/GameDebtPay"
        lastBankruptcy:
          nullable: true
          description: Phase 14.0 — most recent eliminate wipe for toasts
          allOf:
            - $ref: "#/components/schemas/GameLastBankruptcy"
        lastCard:
          nullable: true
          description: |
            Phase 12.2 — most recent Chance / Community Chest draw.
            Cash/move/jail effects apply in 12.3; GOOJF is already held on the player.
          allOf:
            - $ref: "#/components/schemas/GameLastCard"
        winnerUserId:
          type: string
          description: Set when status is finished (last active player)
        winnerUsername:
          type: string
          description: Display name of the winner
        turnStartedAt:
          type: string
          format: date-time
          description: |
            UTC instant when the current player's time bank started draining (Phase 6.3b).
            Omitted when finished or clock paused. Clients may tick locally from this + timeRemainingMs.
    LocationsResponse:
      type: object
      additionalProperties: false
      required:
        - locations
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    LocationMap:
      type: object
      additionalProperties: false
      required:
        - x
        - z
        - scale
      properties:
        x:
          type: number
          format: double
        z:
          type: number
          format: double
        scale:
          type: number
          format: double
    LocationAssets:
      type: object
      additionalProperties: false
      required:
        - icon
      properties:
        icon:
          type: string
          description: Billboard art path relative to meetopoly-mobile/
    Location:
      type: object
      additionalProperties: false
      required:
        - id
        - worldId
        - slug
        - name
        - kind
        - boardIndex
        - boardCode
        - price
        - map
        - assets
        - hubId
        - enterRadius
      properties:
        id:
          type: string
          description: MongoDB ObjectId hex
        worldId:
          type: string
        slug:
          type: string
        name:
          type: string
        countryCode:
          type: string
        region:
          type: string
        kind:
          type: string
          enum: [property, airport, utility, special]
          description: Location kind. Air hubs use `airport`.
        boardIndex:
          type: integer
        boardCode:
          type: string
          description: Short tile label unique within worldId (e.g. NYC, CAI, CH, CST)
          minLength: 1
          maxLength: 6
        price:
          type: integer
        rents:
          type: array
          items:
            type: integer
        houseCost:
          type: integer
          nullable: true
        colorGroup:
          type: string
          nullable: true
        specialType:
          type: string
          nullable: true
        utilityMultiplier:
          type: array
          items:
            type: integer
        taxAmount:
          type: integer
          nullable: true
        passBonus:
          type: integer
          nullable: true
        map:
          $ref: "#/components/schemas/LocationMap"
        assets:
          $ref: "#/components/schemas/LocationAssets"
        hubId:
          type: string
        enterRadius:
          type: number
          format: double
        description:
          type: string
        svgcities:
          type: string
        svgcitiesPath:
          type: string
        svgcitiesUrl:
          type: string
        attribution:
          type: string
        symbol:
          type: string
        symbolStory:
          type: string
        about:
          type: string
        aboutShort:
          type: string
        tags:
          type: array
          items:
            type: string
        landmarkCategory:
          type: string

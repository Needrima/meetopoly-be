openapi: 3.0.3
info:
  title: Meetopoly API
  version: 0.10.0
  description: |
    Meetopoly HTTP API contract.
    Source of truth for mobile codegen (orval → meetopoly-mobile/api/).
  contact:
    name: Meetopoly
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
    description: Liveness and dependency checks
  - name: Auth
    description: Email signup, verification, login, session
  - name: User
    description: Authenticated profile
  - name: Locations
    description: World board content (seeded locations)
  - name: Worlds
    description: Distinct world packs derived from locations
  - name: Tables
    description: Matchmaking lobby (join pool, ready, leave)
  - name: Games
    description: Authoritative M1 game state (Phase 6+)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency ping
      description: |
        Returns dependency status. HTTP 200 when status is `ok`;
        HTTP 503 when status is `degraded` (body still a HealthResponse).
      tags:
        - Health
      responses:
        "200":
          description: Service and dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service up but a dependency failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/signup/start:
    post:
      operationId: signupStart
      summary: Start signup by email
      description: |
        Accepts an email and sends a 6-digit verification code via SMTP.
        Always returns 204 when the request is well-formed (anti-enumeration).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupStartRequest"
      responses:
        "204":
          description: Verification email sent if the address is eligible
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Mail or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/verify:
    post:
      operationId: signupVerify
      summary: Verify email with 6-digit code
      description: On success returns a short-lived signup token for password + profile steps.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupVerifyRequest"
      responses:
        "200":
          description: Email verified; signup token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupVerifyResponse"
        "400":
          description: Invalid request or code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/password:
    post:
      operationId: signupSetPassword
      summary: Set password during signup
      description: Requires Bearer signup token from `/auth/signup/verify`.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupPasswordRequest"
      responses:
        "204":
          description: Password set
        "400":
          description: Weak or invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid signup token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/profile:
    post:
      operationId: signupCompleteProfile
      summary: Finish profile and start session
      description: |
        Requires Bearer signup token. Sets username + country and returns an opaque session token.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupProfileRequest"
      responses:
        "200":
          description: Profile complete; session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid username or country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid signup token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup/status:
    get:
      operationId: signupStatus
      summary: Signup progress for a signup Bearer token
      description: |
        Used to resume onboarding. Only `passwordSet: true` is durable progress;
        OTP-only accounts should discard the draft and stay on login.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current signup progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupStatusResponse"
        "401":
          description: Missing or invalid signup token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      summary: Login with email and password
      description: |
        Requires verified email and a password. When the profile is incomplete,
        returns `needsProfile: true` plus a reissued signup token instead of a session.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated, or resume profile step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials or incomplete signup (no password yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked (idempotent if already gone)
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/start:
    post:
      operationId: passwordResetStart
      summary: Start password reset by email
      description: |
        Sends a 6-digit code only when the email belongs to a fully registered user.
        Response `sent` is false when no mail was sent (unknown or incomplete account).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetStartRequest"
      responses:
        "200":
          description: Whether a reset email was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetStartResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Mail or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/verify:
    post:
      operationId: passwordResetVerify
      summary: Verify password-reset code
      description: On success returns a short-lived reset token for setting a new password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetVerifyRequest"
      responses:
        "200":
          description: Code verified; reset token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetVerifyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/confirm:
    post:
      operationId: passwordResetConfirm
      summary: Set a new password after reset verify
      description: |
        Requires Bearer reset token. Updates the password and revokes all existing login sessions.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password updated; sessions revoked
        "400":
          description: Weak or invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      summary: Current user profile
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /worlds:
    get:
      operationId: listWorlds
      summary: List world packs
      description: Distinct `worldId` values with location counts from the `locations` collection.
      tags:
        - Worlds
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worlds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldsResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/join:
    post:
      operationId: joinTable
      summary: Join a World matchmaking lobby
      description: |
        Finds an open lobby for `worldId` (or creates one), seats the caller,
        and returns the table snapshot. Connect to `GET /ws/tables/{tableId}?token=`
        for live seat/ready updates. Messages: client `{type:ready|leave|ping}`,
        server `{type:state|started|pong|error}`.
      tags:
        - Tables
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTableRequest"
      responses:
        "200":
          description: Seated in lobby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid world
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Table full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}:
    get:
      operationId: getTable
      summary: Get table snapshot
      tags:
        - Tables
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}/ready:
    post:
      operationId: setTableReady
      summary: Toggle Ready for the local seat
      description: Requires ≥2 seated. When every seated player is Ready, status becomes `starting` and WS emits `started`.
      tags:
        - Tables
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTableReadyRequest"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Need more players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not seated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}/leave:
    post:
      operationId: leaveTable
      summary: Leave lobby (frees seat immediately)
      tags:
        - Tables
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated table after leave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}:
    get:
      operationId: getGame
      summary: Get M1 game snapshot
      description: |
        Authoritative game state (players, MeetCoin balances, pin boardIndex, whose turn).
        Created when a lobby reaches all-Ready (Phase 6.0).
        Live updates: connect to `GET /ws/games/{gameId}?token=` (same auth as table lobby WS);
        server pushes `{ "type": "state", "game": Game }` after roll / end-turn.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/roll:
    post:
      operationId: rollDice
      summary: Roll dice on your turn
      description: |
        Server rolls 2d6 and moves the caller's pin (unless third consecutive doubles).
        Awards pass-GO MeetCoin when applicable. Does **not** advance turn (Phase 6.2).
        Doubles → may roll again; non-doubles or third doubles → must `end-turn`.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not your turn, must end turn first, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/end-turn:
    post:
      operationId: endTurn
      summary: End your turn
      description: |
        Advances to the next seat (Phase 6.2). Allowed only when `turnPhase` is `awaiting_end`
        (after a non-doubles roll, or after third consecutive doubles).
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not your turn, must roll first, or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/resign:
    post:
      operationId: resignGame
      summary: Resign and leave the game
      description: |
        Phase 6.2c — voluntary leave mid-game counts as resigning.
        Marks the caller `resigned`, skips them for turns, broadcasts state.
        If only one active player remains, that player wins and `status` becomes `finished`.
        Asset transfer / bankruptcy cleanup stays Phase 14.
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already resigned or game inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations:
    get:
      operationId: listLocations
      summary: List locations for a world
      description: Returns board spaces for `worldId`, sorted by `boardIndex`.
      tags:
        - Locations
      security:
        - bearerAuth: []
      parameters:
        - name: worldId
          in: query
          required: true
          schema:
            type: string
            example: africa-1
          description: World pack id (e.g. africa-1)
      responses:
        "200":
          description: Locations for the world
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationsResponse"
        "400":
          description: Missing worldId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/by-slug:
    get:
      operationId: getLocationBySlug
      summary: Get location by world and slug
      tags:
        - Locations
      security:
        - bearerAuth: []
      parameters:
        - name: worldId
          in: query
          required: true
          schema:
            type: string
            example: africa-1
        - name: slug
          in: query
          required: true
          schema:
            type: string
            example: accra
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Missing worldId or slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/{locationId}:
    get:
      operationId: getLocationById
      summary: Get location by Mongo id
      tags:
        - Locations
      security:
        - bearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
          description: MongoDB ObjectId hex string
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          description: Missing or invalid session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque session token (or short-lived signup token) stored in Redis
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - mongo
        - redis
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall health
        mongo:
          type: string
          enum: [ok, error]
          description: MongoDB ping result
        redis:
          type: string
          enum: [ok, error]
          description: Redis ping result
        version:
          type: string
          description: Optional build/version label
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable detail
    SignupStartRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Account email address
    SignupVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6-digit verification code from email
    SignupVerifyResponse:
      type: object
      additionalProperties: false
      required:
        - signupToken
      properties:
        signupToken:
          type: string
          description: Short-lived Bearer token for password + profile steps
    SignupPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    SignupProfileRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - country
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[A-Za-z0-9_]{3,20}$"
          description: Unique username (letters, digits, underscore)
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code (uppercase)
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - needsProfile
        - user
      properties:
        needsProfile:
          type: boolean
          description: True when password is set but username/country are missing
        token:
          type: string
          nullable: true
          description: Opaque session token when needsProfile is false
        signupToken:
          type: string
          nullable: true
          description: Reissued signup Bearer token when needsProfile is true
        user:
          $ref: "#/components/schemas/UserProfile"
    SignupStatusResponse:
      type: object
      additionalProperties: false
      required:
        - email
        - passwordSet
        - profileComplete
      properties:
        email:
          type: string
          format: email
        passwordSet:
          type: boolean
        profileComplete:
          type: boolean
    PasswordResetStartRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordResetStartResponse:
      type: object
      additionalProperties: false
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: True when a reset code email was sent
    PasswordResetVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"
    PasswordResetVerifyResponse:
      type: object
      additionalProperties: false
      required:
        - resetToken
      properties:
        resetToken:
          type: string
          description: Short-lived Bearer token for password reset confirm
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Opaque session token (store in expo-secure-store)
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - emailVerified
        - profileComplete
      properties:
        id:
          type: string
          description: User id
        email:
          type: string
          format: email
        username:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 when set
        emailVerified:
          type: boolean
        profileComplete:
          type: boolean
          description: True when username and country are set
    WorldSummary:
      type: object
      additionalProperties: false
      required:
        - worldId
        - count
      properties:
        worldId:
          type: string
          example: africa-1
        count:
          type: integer
          description: Number of location documents in this world
    WorldsResponse:
      type: object
      additionalProperties: false
      required:
        - worlds
      properties:
        worlds:
          type: array
          items:
            $ref: "#/components/schemas/WorldSummary"
    JoinTableRequest:
      type: object
      additionalProperties: false
      required:
        - worldId
      properties:
        worldId:
          type: string
          example: africa-1
    SetTableReadyRequest:
      type: object
      additionalProperties: false
      required:
        - ready
      properties:
        ready:
          type: boolean
    TableSeat:
      type: object
      additionalProperties: false
      required:
        - seatIndex
        - ready
        - holding
      properties:
        seatIndex:
          type: integer
          minimum: 0
          maximum: 5
        userId:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        ready:
          type: boolean
        holding:
          type: boolean
        holdEndsAt:
          type: string
          format: date-time
          nullable: true
    Table:
      type: object
      additionalProperties: false
      required:
        - id
        - worldId
        - status
        - seats
      properties:
        id:
          type: string
        worldId:
          type: string
        status:
          type: string
          enum: [lobby, starting, in_game]
        gameId:
          type: string
          nullable: true
          description: Set when lobby starts an M1 game (Phase 6+)
        seats:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/TableSeat"
    GamePlayer:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - seatIndex
        - turnOrder
        - cash
        - boardIndex
        - pinColor
        - resigned
        - timeRemainingMs
      properties:
        userId:
          type: string
        username:
          type: string
        seatIndex:
          type: integer
        turnOrder:
          type: integer
        cash:
          type: integer
          description: MeetCoin balance
        boardIndex:
          type: integer
          description: Rules pin position (0 = GO)
        pinColor:
          type: string
          description: Hex accent for the pin
        resigned:
          type: boolean
          description: Left mid-game or time-bank eliminated; skipped for turns
        timeRemainingMs:
          type: integer
          format: int64
          description: |
            Personal time bank remaining in milliseconds (Phase 6.3b).
            For the current player this is live (bank minus elapsed on this turn).
            For others it is the paused remainder. Starts at 45 minutes.
    GameLastRoll:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - die1
        - die2
        - total
        - fromIndex
        - toIndex
        - passedGo
        - passGoAmount
        - isDoubles
        - doublesStreak
        - thirdDoubles
      properties:
        userId:
          type: string
        username:
          type: string
        die1:
          type: integer
          minimum: 1
          maximum: 6
        die2:
          type: integer
          minimum: 1
          maximum: 6
        total:
          type: integer
        fromIndex:
          type: integer
        toIndex:
          type: integer
        passedGo:
          type: boolean
        passGoAmount:
          type: integer
          description: MeetCoin awarded this roll for passing/landing on GO
        isDoubles:
          type: boolean
        doublesStreak:
          type: integer
          description: Consecutive doubles count after this roll (1–3)
        thirdDoubles:
          type: boolean
          description: True when movement was skipped (Jail deferred to Phase 12)
    Game:
      type: object
      additionalProperties: false
      required:
        - id
        - tableId
        - worldId
        - status
        - players
        - currentTurn
        - currentUserId
        - currentUsername
        - passGoBonus
        - currency
        - turnPhase
        - doublesStreak
        - canRoll
        - canEndTurn
      properties:
        id:
          type: string
        tableId:
          type: string
        worldId:
          type: string
        status:
          type: string
          enum: [active, finished]
        players:
          type: array
          items:
            $ref: "#/components/schemas/GamePlayer"
        currentTurn:
          type: integer
          description: turnOrder of the active player
        currentUserId:
          type: string
        currentUsername:
          type: string
        passGoBonus:
          type: integer
          description: MeetCoin granted when passing GO
        currency:
          type: string
          example: MeetCoin
        turnPhase:
          type: string
          enum: [awaiting_roll, awaiting_end]
        doublesStreak:
          type: integer
        canRoll:
          type: boolean
        canEndTurn:
          type: boolean
        lastRoll:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GameLastRoll"
        winnerUserId:
          type: string
          description: Set when status is finished (last active player)
        winnerUsername:
          type: string
          description: Display name of the winner
        turnStartedAt:
          type: string
          format: date-time
          description: |
            UTC instant when the current player's time bank started draining (Phase 6.3b).
            Omitted when finished or clock paused. Clients may tick locally from this + timeRemainingMs.
    LocationsResponse:
      type: object
      additionalProperties: false
      required:
        - locations
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    LocationMap:
      type: object
      additionalProperties: false
      required:
        - x
        - z
        - scale
      properties:
        x:
          type: number
          format: double
        z:
          type: number
          format: double
        scale:
          type: number
          format: double
    LocationAssets:
      type: object
      additionalProperties: false
      required:
        - icon
      properties:
        icon:
          type: string
          description: Billboard art path relative to meetopoly-mobile/
    Location:
      type: object
      additionalProperties: false
      required:
        - id
        - worldId
        - slug
        - name
        - kind
        - boardIndex
        - boardCode
        - price
        - map
        - assets
        - hubId
        - enterRadius
      properties:
        id:
          type: string
          description: MongoDB ObjectId hex
        worldId:
          type: string
        slug:
          type: string
        name:
          type: string
        countryCode:
          type: string
        region:
          type: string
        kind:
          type: string
          enum: [property, railroad, utility, special]
        boardIndex:
          type: integer
        boardCode:
          type: string
          description: Short tile label unique within worldId (e.g. NYC, CAI, CH, CST)
          minLength: 1
          maxLength: 6
        price:
          type: integer
        rents:
          type: array
          items:
            type: integer
        houseCost:
          type: integer
          nullable: true
        colorGroup:
          type: string
          nullable: true
        specialType:
          type: string
          nullable: true
        utilityMultiplier:
          type: array
          items:
            type: integer
        taxAmount:
          type: integer
          nullable: true
        passBonus:
          type: integer
          nullable: true
        map:
          $ref: "#/components/schemas/LocationMap"
        assets:
          $ref: "#/components/schemas/LocationAssets"
        hubId:
          type: string
        enterRadius:
          type: number
          format: double
        description:
          type: string
        svgcities:
          type: string
        svgcitiesPath:
          type: string
        svgcitiesUrl:
          type: string
        attribution:
          type: string
        symbol:
          type: string
        symbolStory:
          type: string
        about:
          type: string
        aboutShort:
          type: string
        tags:
          type: array
          items:
            type: string
        landmarkCategory:
          type: string

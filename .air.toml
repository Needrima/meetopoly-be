# Air hot-reload for meetopoly-be
# https://github.com/air-verse/air
# Install: go install github.com/air-verse/air@latest
# Run:     air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/meetopoly-be ."
  entrypoint = ["./tmp/meetopoly-be"]
  delay = 800
  exclude_dir = ["tmp", "vendor", "city-icons", "seeds", "docs"]
  exclude_file = ["app.log", "build-errors.log"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "2s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
